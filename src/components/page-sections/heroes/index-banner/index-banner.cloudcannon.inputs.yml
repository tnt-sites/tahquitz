id:
  type: text
  comment: Optional HTML id attribute for this section.
eyebrow:
  type: text
  comment: Small line above the heading. This is the page's H1 (e.g. "Dentist in Palm Springs").
heading:
  type: text
  comment: Large heading over the photo.
text:
  type: markdown
  comment: Intro text below the heading.
  options:
    bold: true
    italic: true
    link: true
imageSource:
  type: image
  comment: Background photo. Shown on desktop, and on phones when there's no video.
  options:
    paths:
      uploads: src/assets/images
      static: ""
imageAlt:
  type: text
  comment: Alt text for the photo.
videoSource:
  type: file
  comment: Optional looping video (MP4) that plays behind the text on phones and tablets. Leave empty to use the photo everywhere.
  options:
    paths:
      uploads: public/videos
      static: public
videoPoster:
  type: image
  comment: Still frame shown while the video loads.
  options:
    paths:
      uploads: public/images
      static: public
offersHeading:
  type: text
  comment: Label on the Special Offers bar.
offers:
  type: array
  comment: Offers along the bottom of the banner. Each one opens a popup with its own form.
  options:
    preview:
      text:
        - key: amount
      subtext:
        - key: treatment
"offers[*].amount":
  type: text
  comment: e.g. "$600 Off".
"offers[*].treatment":
  type: text
  comment: e.g. "Dental Implants". Sent with the form so the office knows which offer was redeemed.
"offers[*].linkText":
  type: text
  comment: Text under the offer. Defaults to "View Offer".
"offers[*].formAction":
  type: text
  comment: Optional form address for this offer only. Leave empty to use the form address below.
formText:
  type: textarea
  comment: Short line above each offer's form in the popup.
formAction:
  type: text
  comment: Form address every offer's form posts to, unless an offer sets its own.
