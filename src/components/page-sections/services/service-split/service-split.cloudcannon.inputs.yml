id:
  type: text
  comment: Optional HTML id attribute for this section.
anchorName:
  type: text
  comment: Optional anchor name for linking to this section.
heading:
  type: text
  comment: Section heading.
subtext:
  type: markdown
  comment: Section copy. Supports lists, bold and links.
  options:
    bold: true
    italic: true
    link: true
    bulletedlist: true
    numberedlist: true
imageSource:
  type: image
  comment: Section photo. Leave empty for a text-only section.
  options:
    paths:
      uploads: src/assets/images
      static: ""
imageAlt:
  type: text
  comment: Alt text for the photo.
imageLeft:
  type: switch
  comment: Put the photo on the left on desktop (default is right).
compact:
  type: switch
  comment: Smaller sub-item style with a small photo, for lists of options under a main section.
background:
  type: select
  comment: Section background.
  options:
    values:
      - id: white
        name: White
      - id: tint
        name: Light Blue
buttonSections:
  type: array
  comment: Buttons below the copy.
  options:
    structures: _structures.buttonSections
