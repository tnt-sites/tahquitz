id:
  type: text
  comment: Optional HTML id attribute for this section.
heading:
  type: text
  comment: Large heading (e.g. "The Tahquitz Dental Experience").
subtext:
  type: markdown
  comment: Copy below the heading.
  options:
    bold: true
    italic: true
    link: true
imageSource:
  type: image
  comment: Wide photo that runs to the edge of the screen on desktop.
  options:
    paths:
      uploads: src/assets/images
      static: ""
imageAlt:
  type: text
  comment: Alt text for the photo.
imageLeft:
  type: switch
  comment: Put the photo on the left on desktop (default is right).
buttonSections:
  type: array
  comment: Buttons below the copy.
  options:
    structures: _structures.buttonSections
