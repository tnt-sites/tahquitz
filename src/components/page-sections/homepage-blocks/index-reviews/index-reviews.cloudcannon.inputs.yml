id:
  type: text
  comment: Optional HTML id attribute for this section.
heading:
  type: text
  comment: e.g. "Read What Our Patients Are Saying".
reviews:
  type: array
  comment: One slide per review. Arrows and dots only show with two or more.
  options:
    preview:
      text:
        - key: authorName
      subtext:
        - key: text
      image:
        - key: reviewerImage
"reviews[*].text":
  type: textarea
  comment: The review.
"reviews[*].authorName":
  type: text
  comment: Reviewer's first name (e.g. "Vincent").
"reviews[*].reviewerImage":
  type: image
  comment: Optional small round photo of the reviewer.
  options:
    paths:
      uploads: src/assets/images
      static: ""
"reviews[*].reviewerImageAlt":
  type: text
  comment: Usually leave empty, since the reviewer's name is shown next to the photo.
buttonSections:
  type: array
  comment: Button below the slider (e.g. "View More Reviews").
  options:
    structures: _structures.buttonSections
